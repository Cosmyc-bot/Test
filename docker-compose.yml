services:
  spy-agent:
    build: .
    image: spy-market-bottom-agent:latest
    container_name: spy-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
