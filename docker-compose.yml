services:
  spy-agent:
    build: .
    image: spy-market-bottom-agent:latest
    container_name: spy-agent
    restart: unless-stopped
    ports:
      # Bind only to localhost — nginx proxies externally.
      # Remove "127.0.0.1:" prefix if you want to expose directly (no nginx).
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
