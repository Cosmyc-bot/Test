# ─────────────────────────────────────────────────────────────────────────────
# SPY Market-Bottom Agent — nginx reverse-proxy snippet
# ─────────────────────────────────────────────────────────────────────────────
#
# HOW TO USE
# ──────────────────────────────────────────────────────────────────────────
# 1. Copy this file to your VPS:
#      scp nginx.conf user@93.90.203.184:/etc/nginx/conf.d/spy-agent.conf
#
# 2. OR paste the `location` block below into your existing
#    server { } block in /etc/nginx/sites-available/default
#
# 3. Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx
#
# Agent will be reachable at:
#   http://93.90.203.184/spy-agent/signal
#   http://93.90.203.184/spy-agent/health
#
# Note: SSL (HTTPS) requires a domain name pointed at this IP.
#       If you add a domain later, run:
#       sudo certbot --nginx -d yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name 93.90.203.184;

    # ── SPY Agent sub-path ─────────────────────────────────────────────────
    #
    # The trailing slash on proxy_pass strips /spy-agent from the URL before
    # forwarding, so the Flask app always sees /signal, /health, etc.
    #
    location /spy-agent/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeout — Yahoo Finance fetch can take a few seconds
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS headers (optional — remove if not needed)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # ── Redirect /spy-agent → /spy-agent/ (no trailing slash) ─────────────
    location = /spy-agent {
        return 301 /spy-agent/;
    }

    # ── Your other site content goes here ─────────────────────────────────
    # location / { ... }
}
